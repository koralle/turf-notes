name: Test

on:
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  domain:
    name: Domain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/composite-actions/cache-and-install
      - run: pnpm --filter @turf-notes/domain run test:coverage
      - name: Report coverage
        if: (success() || failure()) && github.event_name == 'pull_request' && hashFiles('packages/domain/coverage/coverage-summary.json') != ''
        uses: davelosert/vitest-coverage-report-action@74c2d9210b4fc44c84d8213f61d7ec99837b7aa0 # v2.13.2
        with:
          working-directory: packages/domain
          vite-config-path: vitest.config.ts

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/composite-actions/cache-and-install
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @turf-notes/web exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @turf-notes/web exec playwright install-deps chromium
      - run: pnpm --filter @turf-notes/web run test:coverage
      - name: Report coverage
        if: (success() || failure()) && github.event_name == 'pull_request' && hashFiles('apps/web/coverage/coverage-summary.json') != ''
        uses: davelosert/vitest-coverage-report-action@74c2d9210b4fc44c84d8213f61d7ec99837b7aa0 # v2.13.2
        with:
          working-directory: apps/web
          vite-config-path: vitest.config.ts

  api:
    name: API
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/composite-actions/cache-and-install
      - run: pnpm --filter @turf-notes/api run test:coverage
      - name: Report coverage
        if: (success() || failure()) && github.event_name == 'pull_request' && hashFiles('apps/api/coverage/coverage-summary.json') != ''
        uses: davelosert/vitest-coverage-report-action@74c2d9210b4fc44c84d8213f61d7ec99837b7aa0 # v2.13.2
        with:
          working-directory: apps/api
          vite-config-path: vitest.config.ts

  oxlint-plugin:
    name: Oxlint Plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/composite-actions/cache-and-install
      - run: pnpm --filter @turf-notes/oxlint-plugin run test:coverage
      - name: Report coverage
        if: (success() || failure()) && github.event_name == 'pull_request' && hashFiles('packages/oxlint-plugin/coverage/coverage-summary.json') != ''
        uses: davelosert/vitest-coverage-report-action@74c2d9210b4fc44c84d8213f61d7ec99837b7aa0 # v2.13.2
        with:
          working-directory: packages/oxlint-plugin
          vite-config-path: vitest.config.ts
