name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/composite-actions/cache-and-install
      - run: pnpm run check

  doctor:
    name: React Doctor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/composite-actions/cache-and-install
      - run: pnpm run doctor

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/composite-actions/cache-and-install
      - run: pnpm run typecheck

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/composite-actions/cache-and-install
      # story の play は実ブラウザ（Vitest browser mode）で回す。Chromium だけ要る。
      - name: Install Chromium for Vitest browser mode
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test

  knip:
    name: Unused dependencies and exports
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/composite-actions/cache-and-install
      # styled-system は Panda の生成物（git 管理外）。無いと knip が解決できない。
      - run: pnpm --filter @turf-notes/web run panda:codegen
      - run: pnpm run knip

  migrations:
    name: Migrations are append-only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 既存マイグレーションの変更を禁止する
        env:
          # PR ならターゲットブランチ、workflow_call（main へのデプロイ）なら main
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: bash .github/scripts/forbid-existing-migration-changes.sh

  skills:
    name: Skills match apm.lock.yaml
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # .agents/skills は apm の生成物。手で直すとロックとずれるので CI で検出する。
      # brew を挟まず、mise の `github:microsoft/apm` から apm を入れる。
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          mise_toml: |
            [tools]
            apm = "0.35.0"
      - name: Check deployed skills against apm.lock.yaml
        run: apm audit --ci

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/composite-actions/cache-and-install
      - run: pnpm run build

  storybook:
    name: Build Storybook
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/composite-actions/cache-and-install
      - run: pnpm --filter @turf-notes/web run build-storybook
