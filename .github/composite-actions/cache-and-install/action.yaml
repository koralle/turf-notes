name: Cache and install
description: pnpm と Node を用意し、ロックファイルどおりに依存をインストールする

inputs:
  turbo-cache:
    description: Turborepo のキャッシュ（.turbo/cache）を actions/cache で保存・復元するか
    required: false
    default: "true"
  turbo-cache-scope:
    description: Turborepo キャッシュキーに使うスコープ（未指定時は github.job）
    required: false
    default: ""

runs:
  using: composite
  steps:
    # ランタイムは package.json の devEngines.runtime（^26.0.0）に従う。
    # `--frozen-lockfile` と `--no-runtime` は pnpm/setup が付与する。
    - name: Setup pnpm and Node
      uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        cache: true
        require-lockfile: true

    - name: Cache Turborepo
      if: inputs.turbo-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: ${{ runner.os }}-turbo-${{ inputs.turbo-cache-scope || github.job }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ inputs.turbo-cache-scope || github.job }}-
