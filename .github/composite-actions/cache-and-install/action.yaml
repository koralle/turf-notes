name: Cache and install
description: pnpm と Node を用意し、ロックファイルどおりに依存をインストールする

runs:
  using: composite
  steps:
    # devEngines.runtime は `>=24.0.0` なので、CI で使う Node を 24 に固定する。
    # `--frozen-lockfile` と `--no-runtime` は require-lockfile / runtime の指定から付く。
    - name: Setup pnpm and Node
      uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      with:
        runtime: node@24
        cache: true
        require-lockfile: true
