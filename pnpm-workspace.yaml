packages:
  - "apps/*"
  - "packages/*"

catalogMode: strict
saveExact: true
engineStrict: true

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  lefthook: true
  workerd: true
  # testcontainers の任意依存。ローカルの Docker ソケットしか使わないので
  # ネイティブビルド（cpu-features）も CLI 生成（protobufjs）も要らない。
  cpu-features: false
  protobufjs: false
  ssh2: false

# 依存パッケージ同梱スキルの agent への受け渡しは @tanstack/intent に一本化する。
# pnpm の自動リンク（12.11+）は直接依存の 1 階層しか見ないため使わない。
skills:
  dirs: []

catalogs:
  auth:
    "@better-auth/drizzle-adapter": 1.7.27
    "@better-auth/passkey": 1.7.27
    better-auth: 1.7.27

  cloudflare:
    "@cloudflare/vite-plugin": 1.70.1
    wrangler: 4.166.0

  date:
    "@internationalized/date": 3.12.4

  db:
    "@libsql/client": 0.18.0
    drizzle-kit: 1.0.0-rc.5
    drizzle-orm: 1.0.0-rc.5
    uuidv7: 1.2.1

  lint:
    "@interfere/landmines": 0.2.1
    eslint-plugin-storybook: 10.6.8
    oxfmt: 0.79.0
    oxlint: 1.94.0
    oxlint-plugin-react-doctor: 0.9.23
    oxlint-tsgolint: 7.0.2008
    ultracite: 8.3.1

  react:
    "@suspensive/react": 3.21.4
    "@types/react": 19.3.0
    "@types/react-dom": 19.3.0
    react: 19.3.1
    react-dom: 19.3.1

  rpc:
    "@orpc/client": 1.16.5
    "@orpc/contract": 1.16.5
    "@orpc/react-query": 1.16.5
    "@orpc/server": 1.16.5
    hono: 4.13.21

  storybook:
    "@storybook/addon-docs": 10.6.8
    "@storybook/addon-vitest": 10.6.8
    "@storybook/builder-vite": 10.6.8
    "@storybook/tanstack-react": 10.6.8
    storybook: 10.6.8

  tanstack:
    "@tanstack/react-query": 5.108.4
    "@tanstack/react-router": 1.170.46
    "@tanstack/react-router-ssr-query": 1.167.3
    "@tanstack/react-start": 1.169.7

  test:
    "@vitest/browser-playwright": 5.1.1
    "@vitest/coverage-v8": 5.1.1
    confbox: 0.3.2
    msw: 3.0.7
    playwright: 1.65.1
    testcontainers: 12.2.2
    vitest: 5.1.1
    vitest-browser-react: 2.3.0

  tooling:
    "@hono/cli": 0.1.11
    "@tanstack/intent": 0.5.6
    chrome-devtools-mcp: 1.13.0
    knip: 6.48.0
    lefthook: 2.2.2
    react-doctor: 0.9.23
    tsx: 4.23.15

  typescript:
    "@tsconfig/strictest": 2.0.9
    "@types/node": 26.6.6
    tsrs: 0.22.0-ts7.1.0-beta
    type-fest: 5.10.0

  ui:
    "@fontsource/noto-sans-jp": 5.3.1
    "@pandacss/dev": 2.6.0
    "@pandacss/preset-base": 2.6.0
    "@pandacss/preset-panda": 2.6.0
    kiso.css: 1.2.4
    lucide-react: 1.78.0
    markdown-it: 15.0.3
    postcss: 8.5.33
    react-aria-components: 1.22.1

  validation:
    "@conform-to/react": 1.21.3
    valibot: 1.5.0

  vite:
    "@vitejs/plugin-react": 6.3.0
    vite: 8.3.8

# リリース直後のパッケージは pnpm の minimumReleaseAge の対象から明示的に除外する
# （CI の `pnpm install --frozen-lockfile` を supply-chain policy で失敗させないため）。
minimumReleaseAgeExclude:
  - "@orpc/client@1.16.2"
  - "@orpc/contract@1.16.2"
  - "@orpc/interop@1.16.2"
  - "@orpc/server@1.16.2"
  - "@orpc/shared@1.16.2"
  - "@orpc/standard-server-aws-lambda@1.16.2"
  - "@orpc/standard-server-fastify@1.16.2"
  - "@orpc/standard-server-fetch@1.16.2"
  - "@orpc/standard-server-node@1.16.2"
  - "@orpc/standard-server-peer@1.16.2"
  - "@orpc/standard-server@1.16.2"
  - eslint-plugin-storybook@10.6.8
