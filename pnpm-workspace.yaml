packages:
  - "apps/*"
  - "packages/*"

catalogMode: strict
saveExact: true
engineStrict: true

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  lefthook: true
  workerd: true
  # testcontainers の任意依存。ローカルの Docker ソケットしか使わないので
  # ネイティブビルド（cpu-features）も CLI 生成（protobufjs）も要らない。
  cpu-features: false
  protobufjs: false
  ssh2: false

# 依存パッケージ同梱スキルの agent への受け渡しは @tanstack/intent に一本化する。
# pnpm の自動リンク（12.11+）は直接依存の 1 階層しか見ないため使わない。
skills:
  dirs: []

catalogs:
  auth:
    "@better-auth/drizzle-adapter": 1.7.18
    "@better-auth/passkey": 1.7.18
    better-auth: 1.7.18

  cloudflare:
    "@cloudflare/vite-plugin": 1.67.0
    wrangler: 4.158.0

  date:
    "@internationalized/date": 3.12.4

  db:
    "@libsql/client": 0.18.0
    drizzle-kit: 1.0.0-rc.5
    drizzle-orm: 1.0.0-rc.5
    uuidv7: 1.2.1

  lint:
    oxfmt: 0.77.0
    oxlint: 1.92.0
    oxlint-tsgolint: 7.0.2006
    ultracite: 8.1.1

  react:
    "@types/react": 19.3.0
    "@types/react-dom": 19.3.0
    react: 19.3.1
    react-dom: 19.3.1

  rpc:
    "@orpc/client": 1.16.2
    "@orpc/contract": 1.16.2
    "@orpc/react-query": 1.16.2
    "@orpc/server": 1.16.2
    hono: 4.13.16

  storybook:
    "@storybook/addon-docs": 10.6.6
    "@storybook/builder-vite": 10.6.6
    "@storybook/react-vite": 10.6.6
    storybook: 10.6.6

  tanstack:
    "@tanstack/react-query": 5.106.1
    "@tanstack/react-router": 1.170.46
    "@tanstack/react-router-ssr-query": 1.167.3
    "@tanstack/react-start": 1.169.4

  test:
    testcontainers: 12.2.1
    vitest: 5.1.0

  tooling:
    "@hono/cli": 0.1.11
    "@tanstack/intent": 0.5.6
    knip: 6.44.1
    lefthook: 2.2.2
    react-doctor: 0.9.22
    tsx: 4.23.15

  typescript:
    "@tsconfig/strictest": 2.0.8
    "@types/node": 26.6.6
    tsrs: 0.22.0-ts7.1.0-beta
    type-fest: 5.10.0

  ui:
    "@fontsource/noto-sans-jp": 5.3.1
    "@pandacss/dev": 2.5.0
    "@pandacss/preset-base": 2.5.0
    "@pandacss/preset-panda": 2.5.0
    kiso.css: 1.2.4
    lucide-react: 1.70.0
    markdown-it: 15.0.3
    postcss: 8.5.32
    react-aria-components: 1.22.1

  validation:
    "@conform-to/react": 1.21.3
    valibot: 1.5.0

  vite:
    "@vitejs/plugin-react": 6.2.1
    vite: 8.3.6

# リリース直後のパッケージは pnpm の minimumReleaseAge の対象から明示的に除外する
# （CI の `pnpm install --frozen-lockfile` を supply-chain policy で失敗させないため）。
minimumReleaseAgeExclude:
  - "@orpc/client@1.16.2"
  - "@orpc/contract@1.16.2"
  - "@orpc/interop@1.16.2"
  - "@orpc/server@1.16.2"
  - "@orpc/shared@1.16.2"
  - "@orpc/standard-server-aws-lambda@1.16.2"
  - "@orpc/standard-server-fastify@1.16.2"
  - "@orpc/standard-server-fetch@1.16.2"
  - "@orpc/standard-server-node@1.16.2"
  - "@orpc/standard-server-peer@1.16.2"
  - "@orpc/standard-server@1.16.2"
  - "@oxfmt/binding-android-arm-eabi@0.77.0"
  - "@oxfmt/binding-android-arm64@0.77.0"
  - "@oxfmt/binding-darwin-arm64@0.77.0"
  - "@oxfmt/binding-darwin-x64@0.77.0"
  - "@oxfmt/binding-freebsd-x64@0.77.0"
  - "@oxfmt/binding-linux-arm-gnueabihf@0.77.0"
  - "@oxfmt/binding-linux-arm-musleabihf@0.77.0"
  - "@oxfmt/binding-linux-arm64-gnu@0.77.0"
