<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
</head>
<body class="theme-a mobile">
<div class="canvas-label">モバイル ／ 常設の入力欄＋下部タブ＋新規メモの FAB</div>
<div class="phone">
  <div class="app">
    <main>
      <div class="topbar"><h1>メモ</h1><span class="count">128</span></div>
      <div class="composer"><div class="placeholder">思いついたことを書く…</div><div class="btn-save">保存</div></div>
      <div class="toolbar"><div class="search">検索</div></div>
      <div class="timeline">
        <div class="memo-row">
          <div class="date"><span class="y">2026</span><span class="d">11/02</span><span class="w">日</span></div>
          <div class="main-col">
            <div class="title">ソダシは道中で力みが出た。折り合いを欠いた分、終いの伸びを欠いた。</div>
            <div class="meta"><span class="race">東京 11R</span><span class="tag horse">ソダシ</span></div>
          </div>
        </div>
        <div class="memo-row">
          <div class="date"><span class="y">2026</span><span class="d">11/02</span><span class="w">日</span></div>
          <div class="main-col">
            <div class="title">3歳未勝利 芝1800。外差しが効かない一日だった。内を回した馬だけが伸びている。</div>
            <div class="meta"><span class="race">東京 3R</span><span class="tag">馬場</span></div>
          </div>
        </div>
        <div class="memo-row">
          <div class="date"><span class="y">2026</span><span class="d">11/02</span><span class="w">日</span></div>
          <div class="main-col">
            <div class="title">イクイノックスの坂路。終い1F 11.8。余力十分で、次走は楽しみ。</div>
            <div class="meta"><span class="tag horse">イクイノックス</span><span class="tag">調教</span></div>
          </div>
        </div>
        <div class="memo-row">
          <div class="date"><span class="y">2026</span><span class="d">10/26</span><span class="w">日</span></div>
          <div class="main-col">
            <div class="title">三連複の1点あたりの金額が多すぎる。的中率ではなく回収率で見るべき。</div>
            <div class="meta"><span class="tag">買い方</span></div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div class="tabbar">
    <div class="tab active"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg>ホーム</div>
    <div class="tab"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4.5 4.5"/></svg>検索</div>
    <div class="tab"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 7h16M4 12h16M4 17h16"/></svg>設定</div>
  </div>
  <div class="fab">+</div>
</div>
</body>
</html>
